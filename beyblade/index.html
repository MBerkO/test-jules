<!DOCTYPE html>
<html lang="tr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyblade Simülasyonu: Dragoon V2</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="ui-container">
        <div class="header">
            <h1>Dragoon V2</h1>
            <p>Saldırı Tipi - Sol Dönüş</p>

        <div class="controls">
            <button id="btn-letitrip" class="btn primary">Fırlat (Let it Rip!)</button>

            <p>Görünümü değiştirmek için farenizle sürükleyin veya tekerleği kullanın.</p>
        </div>
    </div>

    <!-- 3D Canvas will be injected here -->

    <script src="js/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script type="module">
        import * as CANNON from './js/cannon-es.js';
        window.CANNON = CANNON;
    </script>
    <script type="module" src="js/main.js"></script>

</html>
