<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okan</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --btn-bg: rgba(255, 255, 255, 0.7);
            --btn-hover: rgba(255, 255, 255, 0.9);
            --icon-color: #333333;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #ffffff;
                --btn-bg: rgba(0, 0, 0, 0.5);
                --btn-hover: rgba(0, 0, 0, 0.8);
                --icon-color: #ffffff;
            }
        }

        body.light-mode {
            --bg-color: #ffffff;
            --text-color: #333333;
            --btn-bg: rgba(255, 255, 255, 0.7);
            --btn-hover: rgba(255, 255, 255, 0.9);
            --icon-color: #333333;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #ffffff;
            --btn-bg: rgba(0, 0, 0, 0.5);
            --btn-hover: rgba(0, 0, 0, 0.8);
            --icon-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .photo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .audio-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
        }

        .audio-btn {
            background-color: var(--btn-bg);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .audio-btn:hover {
            background-color: var(--btn-hover);
            transform: scale(1.05);
        }

        .audio-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--icon-color);
        }

        .initial-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .initial-overlay p {
            font-size: 1.2rem;
            margin-top: 15px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .initial-overlay svg {
            width: 48px;
            height: 48px;
            fill: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="photo-container">
        <img src="photo.jpg" alt="Okan">

        <div class="audio-controls" style="display: none;">
            <button class="audio-btn" id="audioToggle" aria-label="Sesi Kapat/Aç">
                <!-- Ses açık ikonu (varsayılan) -->
                <svg id="icon-unmute" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <!-- Ses kapalı ikonu (gizli) -->
                <svg id="icon-mute" style="display: none;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="initial-overlay" id="startOverlay">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 5v14l11-7z"/>
        </svg>
        <p>Başlamak için tıklayın</p>
    </div>

    <audio id="bgMusic" loop>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Tema bilgisini localStorage'dan al ve uygula
        const currentTheme = localStorage.getItem("theme");
        if (currentTheme === "dark") {
            document.body.classList.add("dark-mode");
        } else if (currentTheme === "light") {
            document.body.classList.add("light-mode");
        }

        const bgMusic = document.getElementById("bgMusic");
        const audioToggle = document.getElementById("audioToggle");
        const iconMute = document.getElementById("icon-mute");
        const iconUnmute = document.getElementById("icon-unmute");
        const startOverlay = document.getElementById("startOverlay");
        const audioControls = document.querySelector(".audio-controls");

        let isPlaying = false;

        // Sayfa ilk etkileşimde müziği başlat
        startOverlay.addEventListener("click", () => {
            bgMusic.play().then(() => {
                isPlaying = true;
                startOverlay.style.opacity = '0';
                setTimeout(() => {
                    startOverlay.style.display = 'none';
                    audioControls.style.display = 'block';
                }, 500);
            }).catch(e => {
                console.error("Audio playback failed:", e);
            });
        });

        // Ses açma/kapatma butonu kontrolü
        audioToggle.addEventListener("click", () => {
            if (bgMusic.muted) {
                bgMusic.muted = false;
                iconMute.style.display = "none";
                iconUnmute.style.display = "block";
            } else {
                bgMusic.muted = true;
                iconMute.style.display = "block";
                iconUnmute.style.display = "none";
            }
        });
    </script>
</body>
</html>
